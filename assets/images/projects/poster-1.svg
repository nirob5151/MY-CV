<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <!-- Poster Base -->
  <rect width="800" height="1000" fill="url(#pGrad)" />

  <!-- Grid mesh background -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="1000" />
    <line x1="200" y1="0" x2="200" y2="1000" />
    <line x1="300" y1="0" x2="300" y2="1000" />
    <line x1="400" y1="0" x2="400" y2="1000" />
    <line x1="500" y1="0" x2="500" y2="1000" />
    <line x1="600" y1="0" x2="600" y2="1000" />
    <line x1="700" y1="0" x2="700" y2="1000" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="0" y1="800" x2="800" y2="800" />
  </g>

  <!-- Glowing Geometric Centerpiece -->
  <circle cx="400" cy="460" r="210" fill="none" stroke="url(#neonCyan)" stroke-width="8" stroke-dasharray="16 8" />
  <circle cx="400" cy="460" r="160" fill="none" stroke="url(#neonPink)" stroke-width="4" />
  <polygon points="400,320 520,530 280,530" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.8" />
  
  <!-- Glowing core orb -->
  <circle cx="400" cy="460" r="70" fill="url(#neonPink)" opacity="0.85" filter="blur(20px)" />
  <circle cx="400" cy="460" r="45" fill="#ffffff" opacity="0.9" />

  <!-- Top Header -->
  <text x="70" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#38bdf8" letter-spacing="4">BUBT CSE DEPARTMENT PRESENTS</text>
  <rect x="70" y="110" width="60" height="4" fill="#38bdf8" />

  <!-- Main Headline -->
  <text x="70" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="78" fill="#ffffff" letter-spacing="-1">TECH FEST</text>
  <text x="70" y="275" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="64" fill="url(#neonCyan)" letter-spacing="3">2026 EDITION</text>

  <!-- Subtitle -->
  <text x="70" y="325" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="22" fill="#cbd5e1">CODE • INNOVATE • DESIGN • CONQUER</text>

  <!-- Event Features -->
  <g transform="translate(70, 720)">
    <rect x="0" y="0" width="200" height="70" rx="12" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.15)" />
    <text x="24" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16" fill="#ec4899">HACKATHON</text>
    <text x="24" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#94a3b8">24 Hours Non-stop</text>

    <rect x="230" y="0" width="200" height="70" rx="12" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.15)" />
    <text x="254" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16" fill="#38bdf8">UI/UX BATTLE</text>
    <text x="254" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#94a3b8">Design Sprint</text>

    <rect x="460" y="0" width="200" height="70" rx="12" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.15)" />
    <text x="484" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16" fill="#a855f7">GAMING ARENA</text>
    <text x="484" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#94a3b8">Esports Championship</text>
  </g>

  <!-- Footer Bar -->
  <rect x="70" y="850" width="660" height="85" rx="14" fill="#0f172a" stroke="rgba(255,255,255,0.12)" />
  <text x="100" y="888" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16" fill="#ffffff">VENUE: BUBT MAIN AUDITORIUM</text>
  <text x="100" y="915" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#94a3b8">REGISTRATION CLOSES: NOVEMBER 15</text>
  <text x="690" y="902" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#38bdf8" text-anchor="end">SCAN TO REGISTER</text>
</svg>
