<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="brandBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#brandBg)" />

  <!-- Title watermark -->
  <text x="60" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="32" fill="#0f172a">APEX STUDIO</text>
  <text x="60" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#64748b" letter-spacing="2">BRAND IDENTITY &amp; DESIGN SYSTEM</text>

  <!-- Business Card Mockup Front -->
  <g filter="url(#cardShadow)" transform="translate(60, 160) rotate(-4)">
    <rect width="320" height="190" rx="14" fill="#ffffff" />
    <path d="M40 70 L75 125 L110 70 Z" fill="url(#logoGrad)" />
    <circle cx="75" cy="85" r="14" fill="#ffffff" />
    <text x="130" y="95" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" fill="#0f172a">APEX</text>
    <text x="130" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#64748b" letter-spacing="1.5">CREATIVE LABS</text>
    <rect x="40" y="150" width="80" height="4" rx="2" fill="#4f46e5" />
  </g>

  <!-- Business Card Mockup Back (Dark) -->
  <g filter="url(#cardShadow)" transform="translate(420, 140) rotate(3)">
    <rect width="320" height="190" rx="14" fill="#0f172a" />
    <text x="40" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16" fill="#ffffff">Nirob</text>
    <text x="40" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="12" fill="#818cf8">Lead Brand Strategist</text>
    <line x1="40" y1="110" x2="280" y2="110" stroke="#334155" stroke-width="1" />
    <text x="40" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">hello@apexstudio.design</text>
    <text x="40" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">+880 1XXX-XXXXXX • Dhaka</text>
  </g>

  <!-- Color Palette Swatches -->
  <g transform="translate(60, 420)">
    <text x="0" y="-15" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#475569">PRIMARY COLOR PALETTE</text>
    <rect x="0" y="0" width="85" height="75" rx="10" fill="#0f172a" />
    <text x="8" y="95" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">#0F172A</text>

    <rect x="100" y="0" width="85" height="75" rx="10" fill="#4f46e5" />
    <text x="108" y="95" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">#4F46E5</text>

    <rect x="200" y="0" width="85" height="75" rx="10" fill="#06b6d4" />
    <text x="208" y="95" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">#06B6D4</text>

    <rect x="300" y="0" width="85" height="75" rx="10" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="308" y="95" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">#F8FAFC</text>
  </g>

  <!-- Typography Specimen -->
  <g transform="translate(480, 410)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#475569">TYPEFACE: PLUS JAKARTA SANS</text>
    <text x="0" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="28" fill="#0f172a">Aa Bb Gg 123</text>
    <text x="0" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400" font-size="13" fill="#64748b">The quick brown fox jumps over the lazy dog.</text>
  </g>
</svg>
