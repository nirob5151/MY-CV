<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="appBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#appBg)" />

  <!-- App Window Container with Shadow -->
  <g filter="url(#winShadow)" transform="translate(60, 50)">
    <!-- Window Frame -->
    <rect width="1080" height="700" rx="16" fill="#0b0f19" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />

    <!-- Window Topbar -->
    <rect width="1080" height="48" rx="16" fill="#111827" />
    <circle cx="28" cy="24" r="6" fill="#ef4444" />
    <circle cx="48" cy="24" r="6" fill="#f59e0b" />
    <circle cx="68" cy="24" r="6" fill="#10b981" />
    
    <text x="540" y="29" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#94a3b8" text-anchor="middle">Club Connect — BUBT Student Club Management Portal</text>

    <!-- Sidebar -->
    <g transform="translate(0, 48)">
      <rect width="220" height="652" fill="#0f172a" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      
      <!-- Brand Logo in Sidebar -->
      <g transform="translate(24, 28)">
        <rect width="32" height="32" rx="8" fill="url(#primaryGrad)" />
        <path d="M10 16 L22 16 M16 10 L16 22" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
        <text x="42" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#ffffff">ClubConnect</text>
      </g>

      <!-- Nav Items -->
      <g transform="translate(18, 90)">
        <!-- Active Item -->
        <rect width="184" height="40" rx="8" fill="rgba(99, 102, 241, 0.15)" />
        <circle cx="20" cy="20" r="4" fill="#818cf8" />
        <text x="36" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#818cf8">Dashboard</text>

        <!-- Other Items -->
        <text x="36" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#64748b">Club Directory</text>
        <text x="36" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#64748b">Event Management</text>
        <text x="36" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#64748b">Ticketing &amp; Passes</text>
        <text x="36" y="205" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#64748b">Members &amp; Roles</text>
        <text x="36" y="250" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#64748b">Budgets &amp; Reports</text>
      </g>
    </g>

    <!-- Main Content Area -->
    <g transform="translate(240, 68)">
      <!-- Greeting and Header -->
      <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24" fill="#ffffff">Welcome back, Nirob</text>
      <text x="20" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#94a3b8">Executive Panel • BUBT IT Club</text>

      <!-- Stat Cards -->
      <g transform="translate(20, 80)">
        <!-- Card 1 -->
        <rect width="245" height="100" rx="12" fill="#161e2e" stroke="rgba(255,255,255,0.08)" />
        <text x="20" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#94a3b8">Active Members</text>
        <text x="20" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28" fill="#ffffff">1,482</text>
        <rect x="180" y="20" width="45" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)" />
        <text x="202" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#10b981" text-anchor="middle">+14%</text>

        <!-- Card 2 -->
        <g transform="translate(265, 0)">
          <rect width="245" height="100" rx="12" fill="#161e2e" stroke="rgba(255,255,255,0.08)" />
          <text x="20" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#94a3b8">Upcoming Events</text>
          <text x="20" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28" fill="#ffffff">8</text>
          <rect x="180" y="20" width="45" height="24" rx="12" fill="rgba(99, 102, 241, 0.15)" />
          <text x="202" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#818cf8" text-anchor="middle">LIVE</text>
        </g>

        <!-- Card 3 -->
        <g transform="translate(530, 0)">
          <rect width="265" height="100" rx="12" fill="#161e2e" stroke="rgba(255,255,255,0.08)" />
          <text x="20" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#94a3b8">Registered Attendees</text>
          <text x="20" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28" fill="#ffffff">3,240</text>
          <rect x="200" y="20" width="45" height="24" rx="12" fill="rgba(245, 158, 11, 0.15)" />
          <text x="222" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#f59e0b" text-anchor="middle">98%</text>
        </g>
      </g>

      <!-- Event List and Live Graph -->
      <g transform="translate(20, 210)">
        <!-- Left Table: Recent Activities -->
        <rect width="470" height="380" rx="14" fill="#161e2e" stroke="rgba(255,255,255,0.08)" />
        <text x="24" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="17" fill="#ffffff">Recent Event Registrations</text>

        <!-- Row 1 -->
        <g transform="translate(24, 65)">
          <circle cx="16" cy="16" r="16" fill="#3b82f6" />
          <text x="44" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#ffffff">BUBT Intra Tech Carnival</text>
          <text x="44" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748b">452 Tickets Issued</text>
          <rect x="360" y="6" width="60" height="22" rx="6" fill="rgba(16,185,129,0.15)" />
          <text x="390" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#10b981" text-anchor="middle">Open</text>
        </g>

        <!-- Row 2 -->
        <g transform="translate(24, 130)">
          <circle cx="16" cy="16" r="16" fill="#ec4899" />
          <text x="44" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#ffffff">Graphic Design Bootcamp 2026</text>
          <text x="44" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748b">120 Seats Filled (Full)</text>
          <rect x="360" y="6" width="60" height="22" rx="6" fill="rgba(239,68,68,0.15)" />
          <text x="390" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#ef4444" text-anchor="middle">Closed</text>
        </g>

        <!-- Row 3 -->
        <g transform="translate(24, 195)">
          <circle cx="16" cy="16" r="16" fill="#8b5cf6" />
          <text x="44" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#ffffff">Competitive Programming Workshop</text>
          <text x="44" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748b">88 Registered</text>
          <rect x="360" y="6" width="60" height="22" rx="6" fill="rgba(16,185,129,0.15)" />
          <text x="390" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#10b981" text-anchor="middle">Open</text>
        </g>

        <!-- Right Card: Interactive Chart Visualization -->
        <g transform="translate(490, 0)">
          <rect width="305" height="380" rx="14" fill="#161e2e" stroke="rgba(255,255,255,0.08)" />
          <text x="20" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="17" fill="#ffffff">Engagement Trend</text>
          <!-- Chart curve -->
          <path d="M 30 290 Q 70 230, 110 250 T 170 180 T 230 140 T 270 90" fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round" />
          <circle cx="270" cy="90" r="6" fill="#6366f1" />
          <circle cx="270" cy="90" r="12" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.6" />
          <text x="270" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle">+32% Peak</text>
          <text x="20" y="340" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94a3b8">UI Design &amp; Architecture by Nirob</text>
        </g>
      </g>
    </g>
  </g>
</svg>
