<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="banGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#banGrad)" />

  <!-- Diagonal dynamic geometric shapes -->
  <polygon points="750,0 1200,0 1200,630 600,630" fill="#1e1b4b" opacity="0.6" />
  <polygon points="850,0 1200,0 1200,630 700,630" fill="url(#accentOrange)" opacity="0.2" />
  <line x1="600" y1="630" x2="750" y2="0" stroke="#f59e0b" stroke-width="6" />

  <!-- Abstract Tech Wireframe on right -->
  <g stroke="rgba(255,255,255,0.15)" stroke-width="1.5" fill="none" transform="translate(800, 120)">
    <polygon points="150,0 300,80 300,240 150,320 0,240 0,80" />
    <polygon points="150,50 250,110 250,210 150,270 50,210 50,110" stroke="#38bdf8" />
    <circle cx="150" cy="160" r="40" fill="#ea580c" opacity="0.6" />
  </g>

  <!-- Left Content -->
  <g transform="translate(80, 140)">
    <rect x="0" y="0" width="180" height="34" rx="17" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" />
    <text x="90" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#f59e0b" text-anchor="middle">WEB &amp; ROLL-UP BANNER</text>

    <text x="0" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="64" fill="#ffffff">NATIONAL</text>
    <text x="0" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="64" fill="url(#accentOrange)">HACKATHON 2026</text>

    <text x="0" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="22" fill="#94a3b8">36 Hours to Build Solutions for Real-World Problems</text>

    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="180" height="50" rx="10" fill="#f59e0b" />
      <text x="90" y="31" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#0f172a" text-anchor="middle">REGISTER NOW</text>

      <text x="210" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="18" fill="#ffffff">PRIZE POOL: $10,000</text>
    </g>
  </g>
</svg>
