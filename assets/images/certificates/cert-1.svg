<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="goldSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <rect width="800" height="560" fill="url(#certBg)" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Outer & Inner Borders -->
  <rect x="24" y="24" width="752" height="512" fill="none" stroke="#4f46e5" stroke-width="3" />
  <rect x="36" y="36" width="728" height="488" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4" />

  <!-- Corner Ornaments -->
  <circle cx="36" cy="36" r="6" fill="#4f46e5" />
  <circle cx="764" cy="36" r="6" fill="#4f46e5" />
  <circle cx="36" cy="524" r="6" fill="#4f46e5" />
  <circle cx="764" cy="524" r="6" fill="#4f46e5" />

  <!-- Certificate Header -->
  <text x="400" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28" fill="#1e1b4b" text-anchor="middle" letter-spacing="4">CERTIFICATE OF EXCELLENCE</text>
  <text x="400" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#6366f1" text-anchor="middle" letter-spacing="3">VISUAL DESIGN &amp; CREATIVE PROFICIENCY</text>
  
  <line x1="320" y1="160" x2="480" y2="160" stroke="#cbd5e1" stroke-width="2" />

  <!-- Recipient text -->
  <text x="400" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#64748b" text-anchor="middle">PROUDLY PRESENTED TO</text>
  <text x="400" y="265" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="38" fill="#0f172a" text-anchor="middle">Md Masudur Rahman Nirob</text>

  <!-- Description -->
  <text x="400" y="315" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#475569" text-anchor="middle">For successfully mastering Adobe Creative Suite, Visual Composition,</text>
  <text x="400" y="340" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#475569" text-anchor="middle">and Brand Identity Principles with exceptional skill.</text>

  <!-- Gold Seal -->
  <g transform="translate(400, 430)">
    <circle cx="0" cy="0" r="42" fill="url(#goldSeal)" />
    <circle cx="0" cy="0" r="34" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 2" />
    <text x="0" y="6" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#713f12" text-anchor="middle">VERIFIED</text>
  </g>

  <!-- Signatures -->
  <g transform="translate(140, 450)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#64748b" stroke-width="1.5" />
    <text x="80" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#0f172a" text-anchor="middle">Program Director</text>
    <text x="80" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">[CERTIFICATE ISSUER]</text>
  </g>

  <g transform="translate(500, 450)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#64748b" stroke-width="1.5" />
    <text x="80" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#0f172a" text-anchor="middle">Date of Issuance</text>
    <text x="80" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">October 2025</text>
  </g>
</svg>
