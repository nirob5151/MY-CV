<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cyanBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <rect width="800" height="560" fill="url(#certBg2)" stroke="#312e81" stroke-width="2" />
  
  <!-- Outer & Inner Borders -->
  <rect x="24" y="24" width="752" height="512" fill="none" stroke="#38bdf8" stroke-width="2" />
  <rect x="36" y="36" width="728" height="488" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="8 6" />

  <text x="400" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28" fill="#38bdf8" text-anchor="middle" letter-spacing="4">CERTIFICATE OF COMPLETION</text>
  <text x="400" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#cbd5e1" text-anchor="middle" letter-spacing="3">COMPLETE GRAPHIC DESIGN MASTERCLASS</text>
  
  <line x1="300" y1="165" x2="500" y2="165" stroke="#38bdf8" stroke-width="2" />

  <text x="400" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">AWARDED TO</text>
  <text x="400" y="265" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="36" fill="#ffffff" text-anchor="middle">Md Masudur Rahman Nirob</text>

  <text x="400" y="315" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#cbd5e1" text-anchor="middle">For demonstrating comprehensive proficiency in Photoshop, Illustrator,</text>
  <text x="400" y="340" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#cbd5e1" text-anchor="middle">Canva design workflows, and commercial typography.</text>

  <!-- Cyan Seal Badge -->
  <g transform="translate(400, 430)">
    <circle cx="0" cy="0" r="42" fill="url(#cyanBadge)" />
    <circle cx="0" cy="0" r="34" fill="none" stroke="#ffffff" stroke-width="2" />
    <text x="0" y="6" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle">ACCREDITED</text>
  </g>

  <g transform="translate(140, 450)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#64748b" stroke-width="1.5" />
    <text x="80" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#ffffff" text-anchor="middle">Lead Instructor</text>
    <text x="80" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">[COURSE INSTRUCTOR]</text>
  </g>

  <g transform="translate(500, 450)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#64748b" stroke-width="1.5" />
    <text x="80" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#ffffff" text-anchor="middle">Date Verified</text>
    <text x="80" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">June 2024</text>
  </g>
