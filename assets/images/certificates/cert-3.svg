  <rect width="800" height="560" fill="url(#certBg3)" stroke="#e2e8f0" stroke-width="2" />
  
  <rect x="24" y="24" width="752" height="512" fill="none" stroke="#059669" stroke-width="3" />
  <rect x="36" y="36" width="728" height="488" fill="none" stroke="#a7f3d0" stroke-width="1.5" stroke-dasharray="6 4" />

  <text x="400" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28" fill="#065f46" text-anchor="middle" letter-spacing="4">BUBT COMPUTER SCIENCE CERTIFICATION</text>
  <text x="400" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#059669" text-anchor="middle" letter-spacing="3">WEB APPLICATION DEVELOPMENT &amp; UI ENGINEERING</text>
  
  <line x1="300" y1="165" x2="500" y2="165" stroke="#059669" stroke-width="2" />

