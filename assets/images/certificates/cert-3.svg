  <text x="400" y="265" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="36" fill="#0f172a" text-anchor="middle">Md Masudur Rahman Nirob</text>

  <text x="400" y="315" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#334155" text-anchor="middle">In recognition of practical competence in frontend web architecture,</text>
